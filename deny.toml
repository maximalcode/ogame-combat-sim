# maxi-quality — Rust supply-chain baseline (cargo-deny), issue #58.
#
# Copied into the consumer by scripts/adopt.sh — cargo-deny reads deny.toml
# from the workspace root, and like rustfmt.toml it has no extend mechanism.
#
# One tool, four checks, one supply chain to trust: `advisories` covers what
# cargo-audit would (RustSec), `bans` covers duplicate versions, `licenses`
# and `sources` are opt-in policy — the same argument as the SBOM note in
# actions/layer2: no second tool doing the same walk over the same graph.
#
# Layer 2's OSV-Scanner ALSO reads Cargo.lock, so a consumer on the reusable
# workflow gets two advisory feeds (OSV aggregates RustSec). That overlap is
# deliberate: cargo-deny runs locally and in the consumer's own CI without any
# baseline machinery, which is what a first-commit adoption needs.

[graph]
# Empty = every target. Deliberate: a dependency compiled only on a platform
# CI never builds is still shipped to whoever runs there, and an advisory
# does not care which cfg() gate the dependency sits behind.
targets = []

[advisories]
# The version-2 defaults are already the right posture: a RustSec advisory is
# an ERROR, unmaintained transitive crates warn. `yanked` defaults to warn and
# is raised — a yanked crate was pulled by its own author, usually for a
# soundness or security reason that never got an advisory id; a warning nobody
# reads is not a posture.
yanked = "deny"
# Waivers go here, each with a written reason — same rule as an ESLint
# disable. Scoped and greppable beats invisible:
#   { id = "RUSTSEC-0000-0000", reason = "not reachable: we never deserialize
#     untrusted input with this crate" },
ignore = []

[bans]
# Duplicate semver-incompatible versions of one crate: binary bloat and two
# copies of one bug, but usually introduced transitively and not always
# fixable at the leaf — so it warns rather than gates. Raise it locally once
# the tree is clean if you want the ratchet.
multiple-versions = "warn"
wildcards = "allow" # clippy::wildcard_dependencies already owns this (lints.toml)

[licenses]
# Filled, so `licenses` IS in this repo's `cargo deny check` line. The policy
# is permissive-only: this crate is MIT and a copyleft dependency would make
# that licence a lie. Four entries, and each is here because something in the
# tree needs exactly it:
#   MIT, Apache-2.0 — the Rust ecosystem's dual-licence default, and between
#     them they satisfy every OR-expression in the tree (r-efi's LGPL arm and
#     ryu's BSL arm are both alternatives we decline, not obligations).
#   BSD-3-Clause  — matchit is "MIT AND BSD-3-Clause"; AND, so both are needed.
#   Unicode-3.0   — unicode-ident is "(MIT OR Apache-2.0) AND Unicode-3.0",
#     the licence on the Unicode character tables it embeds.
# Adding a dependency that needs a fifth entry should be a visible decision,
# which failing the gate makes it.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]

[sources]
# crates.io only, by default. A git dependency is a supply chain with no
# registry, no yank mechanism and no advisory feed; adding one should be a
# visible decision, which a warning makes it.
unknown-registry = "warn"
unknown-git = "warn"
