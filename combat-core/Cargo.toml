[package]
name = "combat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The OGame fleet combat engine: rounds, rapid fire, shield bounce, explosions, debris and loot"

# Opts this crate into [workspace.lints] in the root manifest. Cargo does not
# inherit lints implicitly — a member without these two lines is unlinted.
[lints]
workspace = true

[dependencies]
combat-types = { path = "../combat-types", version = "0.1.0" }
rand = { workspace = true }
serde = { workspace = true }
rayon = { workspace = true }
num_cpus = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }
