[package]
name = "combat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface to the OGame combat engine"

# Opts this crate into [workspace.lints] in the root manifest. Cargo does not
# inherit lints implicitly — a member without these two lines is unlinted.
[lints]
workspace = true

[[bin]]
name = "combat-cli"
path = "src/main.rs"

[dependencies]
combat-core = { path = "../combat-core", version = "0.1.0" }
combat-types = { path = "../combat-types", version = "0.1.0" }
combat-fixtures = { path = "../combat-fixtures", version = "0.1.0" }
combat-ogame-api = { path = "../combat-ogame-api", version = "0.1.0" }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
