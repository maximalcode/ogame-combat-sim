name: quality

# The only workflow in this repo. maxi-quality's Layer 2 (Semgrep, Gitleaks,
# OSV-Scanner) runs beside the Rust job that used to live in ci.yml — one file,
# so there is one answer to "is this commit green".
on:
  # Push is filtered so a feature branch is not checked twice — once for the
  # push and once for its pull request.
  push:
    branches: [main, develop]
  # Pull request is NOT filtered, deliberately. Filtering it to [main, develop]
  # means a PR stacked on another feature branch gets no checks at all and
  # reports as green by having nothing to report, which is worse than red.
  pull_request:

# A superseded run tells you nothing you will act on, so cancel it rather than
# leaving it to finish against a commit nobody is looking at any more.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The immutable release pin agrees with .claude/quality-runtime.json and
  # includes upstream's fixed internal action references. Upgrades change both.
  quality:
    uses: maximalcode/maxi-quality/.github/workflows/quality.yml@9d29bc6b9a498d2f863746158b4b4d891fd2f9a0 # v1.2.0
    with:
      # Passed rather than inherited, even though it is upstream's default
      # today. The `rust` job below installs its own toolchain — separate jobs,
      # separate runners — so if upstream advances its default, fmt and clippy
      # would start running on a different compiler from the tests without a
      # line changing here. Bump the two together or not at all.
      rust-version: '1.97.1'

  # The two Rust checks the reusable workflow above does NOT run.
  #
  # It already does `cargo fmt --all --check`, clippy with -Dwarnings, and
  # `cargo deny check advisories bans` — all of them at least as broadly as
  # this file used to, `--all`/`--locked` included. Repeating them here bought
  # a second opinion from identical commands and doubled the time to red.
  #
  # What it leaves are the two things it cannot decide for a consumer:
  #
  #   cargo test          — not upstream's to run; it has no idea what a
  #                         passing suite means here.
  #   deny check licenses — upstream stops at `advisories bans` and says why:
  #                         the licence allowlist is repo policy, and this
  #                         repo's deny.toml holds a filled one.
  #
  # The toolchain and cargo-deny installs stay because a job is a fresh
  # runner; they are setup for the two lines below, not a copy of upstream's.
  #
  # THE JOB NAME IS LOAD-BEARING: branch protection on main and develop
  # requires a check literally named `rust`. Renaming this job silently
  # un-gates both branches — change the protection first.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Pinned cargo-deny (checksum-verified)
        run: |
          curl -sSfL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tgz' | sha256sum -c -
          tar xzf /tmp/cargo-deny.tgz -C "$HOME/.cargo/bin" --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # licenses only — see the comment above. deny.toml's [licenses] block
      # explains what each allowlist entry is carrying.
      - run: cargo deny check licenses
      # Tests build at opt-level 3 (see [profile.test] in Cargo.toml). The
      # engine is a Monte Carlo loop and runs ~14x slower unoptimised.
      - run: cargo test --workspace --locked
