name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A superseded run tells you nothing you will act on, so cancel it rather than
# leaving it to finish against a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than 'stable': with warnings promoted to errors, a
      # toolchain that ships new lints turns a green build red with no code
      # change. Bump this deliberately.
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # -Dwarnings lives here rather than in the manifest so a contributor's
      # local `cargo check` warns instead of failing. CI is the gate.
      - name: cargo clippy — all targets, warnings are errors
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --workspace --all-targets --locked
      # Tests build at opt-level 3 (see [profile.test] in Cargo.toml). The
      # engine is a Monte Carlo loop and runs ~14x slower unoptimised.
      - run: cargo test --workspace --locked
