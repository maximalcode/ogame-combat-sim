[package]
name = "combat-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP server exposing the OGame combat engine"

# Opts this crate into [workspace.lints] in the root manifest. Cargo does not
# inherit lints implicitly — a member without these two lines is unlinted.
[lints]
workspace = true

[[bin]]
name = "combat-api"
path = "src/main.rs"

[dependencies]
combat-core = { path = "../combat-core", version = "0.1.0" }
combat-types = { path = "../combat-types", version = "0.1.0" }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
